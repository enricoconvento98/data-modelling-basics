name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sql-examples:
    name: SQL examples (DuckDB + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUCKDB_VERSION: v1.1.3
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB CLI
        run: |
          curl -fsSL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          mkdir -p "$HOME/bin" && unzip -q duckdb.zip -d "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run every topic on DuckDB
        run: |
          for topic in unified-star-schema kimball-star-schema slowly-changing-dimensions data-vault; do
            echo "::group::$topic (DuckDB)"
            "./$topic/run.sh"
            echo "::endgroup::"
          done

      - name: Run every topic on PostgreSQL
        run: |
          for topic in unified-star-schema kimball-star-schema slowly-changing-dimensions data-vault; do
            echo "::group::$topic (PostgreSQL)"
            "./$topic/run.sh" --postgres
            echo "::endgroup::"
          done

  dbt:
    name: dbt build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt-project/requirements.txt

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: Build and test (3 simulated runs)
        run: ./run_dbt.sh

      - name: Generate docs
        run: |
          dbt docs generate --profiles-dir . --vars '{extract_no: 2, scd_as_of: "2024-06-01"}'

      - name: Upload dbt docs
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            dbt-project/target/index.html
            dbt-project/target/manifest.json
            dbt-project/target/catalog.json
